<!-- SISTEMA ULTRA LIGERO DISTRIBUIDORA TGI - MÁXIMA VELOCIDAD -->
<div id="tgi-bloque-sistema" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 650px; margin: 0 auto; padding: 10px; background: #ffffff;">
  
  <!-- BOTONES DE PESTAÑAS SIMPLES Y RÁPIDAS -->
  <div id="tgi-pestañas" style="display: flex; gap: 8px; overflow-x: auto; padding: 5px 0; margin-bottom: 15px; border-bottom: 2px solid #fafafa; -webkit-overflow-scrolling: touch;"></div>

  <!-- LISTADO DE PRODUCTOS FINO Y COMPACTO -->
  <div id="contenedor-productos" style="display: flex; flex-direction: column; gap: 4px;">
    <p style="text-align: center; color: #999; font-size: 0.9em; padding: 20px;">Cargando catálogo Distribuidora TGI...</p>
  </div>
</div>

<script>
let todosLosProductos = [];
let grupoSeleccionado = "";
const NÚMERO_WHATSAPP = "51917764281";

// 1. Descargar la matriz unificada de forma directa y veloz
async function cargarWebMatriz() {
  const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbPkbgiCxe2RMmyLOrObjSI7yG6u9sszjPvC0BM8mKb3S4Q_lhZLqAaOdAhFW6glpChhoWvdYpHan7/pub?gid=1523459015&single=true&output=csv";
  
  try {
    const res = await fetch(urlCSV);
    const texto = await res.text();
    
    // Convertir el texto CSV a líneas limpias de forma óptima
    const lineas = texto.split(/\r?\n/);
    todosLosProductos = [];
    
    for (let i = 1; i < lineas.length; i++) {
      if (!lineas[i].trim()) continue;
      
      // Separar por comas quitando comillas de texto
      const celdas = lineas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim());
      
      if (celdas.length >= 6 && celdas[0]) {
        todosLosProductos.push({
          id: i,
          categoria: celdas[0], // Columna A
          producto: celdas[1],  // Columna B
          medida: celdas[2],    // Columna C
          precio: parseFloat(celdas[5]) || 0, // Columna F
          cantidad: 0,
          nota: ""
        });
      }
    }

    if (todosLosProductos.length > 0) {
      grupoSeleccionado = todosLosProductos[0].categoria;
    }
    
    reconstruirPantalla();
    crearBotonWhatsApp();
  } catch (err) {
    document.getElementById('contenedor-productos').innerHTML = "<p style='text-align:center; color:red;'>Error de conexión. Revisa tu señal.</p>";
  }
}

// 2. Pintar la interfaz de forma ultra veloz en el teléfono
function reconstruirPantalla() {
  const divPestañas = document.getElementById('tgi-pestañas');
  const divProductos = document.getElementById('contenedor-productos');
  if (!divProductos) return;

  // Sacar los grupos únicos de productos
  const grupos = [...new Set(todosLosProductos.map(p => p.categoria))];

  // Inyectar pestañas estilizadas pero de carga inmediata
  if (divPestañas) {
    divPestañas.innerHTML = grupos.map(g => {
      const activo = g === grupoSeleccionado;
      return `
        <button onclick="cambiarDeGrupo('${g}')" style="
          padding: 6px 14px;
          background: ${activo ? '#1E8449' : '#f5f7fa'};
          color: ${activo ? '#ffffff' : '#4a5568'};
          border: none;
          border-radius: 15px;
          font-size: 0.85em;
          font-weight: 600;
          cursor: pointer;
          white-space: nowrap;
        ">${g}</button>
      `;
    }).join('');
  }

  // Filtrar solo los productos del grupo actual
  const filtrados = todosLosProductos.filter(p => p.categoria === grupoSeleccionado);

  // Armar lista fina, compacta y elegante
  let html = "";
  filtrados.forEach(p => {
    html += `
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid #f7f9fa; font-size: 0.9em; gap: 8px;">
        
        <!-- Nombre y Medida -->
        <div style="flex: 2; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
          <b style="color: #2d3748;">${p.producto}</b>
          <span style="color: #a0aec0; font-size: 0.8em; margin-left: 2px;">(${p.medida.toLowerCase()})</span>
        </div>
        
        <!-- Notas Cortas y Cantidad en una Línea -->
        <div style="flex: 3; display: flex; align-items: center; gap: 6px; justify-content: flex-end;">
          <input type="text" placeholder="Nota (verde, pinto...)" value="${p.nota}" 
            oninput="guardarNota(${p.id}, this.value)" 
            style="width: 100%; max-width: 140px; padding: 4px 6px; border: 1px solid #e2e8f0; border-radius: 4px; font-size: 0.8em; color: #4a5568; background: #fcfdfd; outline: none;">
          
          <input type="number" min="0" placeholder="0" value="${p.cantidad || ''}" 
            oninput="guardarCantidad(${p.id}, this.value)" 
            style="width: 40px; padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; text-align: center; font-size: 0.85em; font-weight: bold; color: #2d3748; outline: none;">
        </div>

        <!-- Precio Neto -->
        <div style="min-width: 60px; text-align: right; font-weight: 600; color: #27AE60;">
          S/. ${p.precio.toFixed(2)}
        </div>

      </div>
    `;
  });

  divProductos.innerHTML = html;
}

function cambiarDeGrupo(nombre) {
  grupoSeleccionado = nombre;
  reconstruirPantalla();
}

function guardarCantidad(id, val) {
  const p = todosLosProductos.find(prod => prod.id === id);
  if (p) {
    p.cantidad = parseFloat(val) || 0;
    actualizarSumaBoton();
  }
}

function guardarNota(id, val) {
  const p = todosLosProductos.find(prod => prod.id === id);
  if (p) p.nota = val.trim();
}

// 3. Crear el botón elegante flotante de WhatsApp
function crearBotonWhatsApp() {
  if (document.getElementById('btn-whatsapp-tgi')) return;

  const btn = document.createElement('div');
  btn.id = 'btn-whatsapp-tgi';
  btn.style.cssText = `
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #1E8449;
    color: white;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 0.9em;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    cursor: pointer;
    z-index: 99999;
    display: flex;
    align-items: center;
    gap: 6px;
  `;
  btn.innerHTML = `🛒 Enviar Pedido (S/. 0.00)`;
  btn.onclick = enviarWhatsApp;
  document.body.appendChild(btn);
}

function actualizarSumaBoton() {
  let t = 0;
  todosLosProductos.forEach(p => t += p.cantidad * p.precio);
  const btn = document.getElementById('btn-whatsapp-tgi');
  if (btn) btn.innerHTML = `🛒 Enviar Pedido (S/. ${t.toFixed(2)})`;
}

// 4. Despachar el texto ordenado a WhatsApp
function enviarWhatsApp() {
  const pedido = todosLosProductos.filter(p => p.cantidad > 0);
  if (pedido.length === 0) {
    alert("Por favor, pon una cantidad antes de enviar.");
    return;
  }
  
  let m = "🛒 *NUEVO PEDIDO - DISTRIBUIDORA TGI*\n\n";
  let total = 0;
  
  pedido.forEach((p, index) => {
    const sub = p.cantidad * p.precio;
    total += sub;
    m += `*${index + 1}. ${p.producto}* (${p.medida.toLowerCase()})\n`;
    m += `   Cant: *${p.cantidad}* x S/. ${p.precio.toFixed(2)} = S/. ${sub.toFixed(2)}\n`;
    if (p.nota) m += `   📝 _Nota: ${p.nota}_\n`;
    m += `---------------------------\n`;
  });
  
  m += `\n💰 *TOTAL ESTIMADO: S/. ${total.toFixed(2)}*`;
  
  window.open(`https://whatsapp.com{NÚMERO_WHATSAPP}&text=${encodeURIComponent(m)}`, '_blank');
}

window.addEventListener('DOMContentLoaded', cargarWebMatriz);
</script>
