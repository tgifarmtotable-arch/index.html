<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGI, CALIDAD sin salir de casa - Catálogo Comercial</title>
</head>
<body style="margin: 0; padding: 0; background-color: #fafafa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

    <!-- CONTENEDOR PRINCIPAL MINIMALISTA -->
    <div style="max-width: 600px; margin: 0 auto; padding: 15px; background: #ffffff; min-height: 100vh; box-shadow: 0 0 10px rgba(0,0,0,0.02);">
        
        <!-- ENCABEZADO -->
        <div style="text-align: center; margin-bottom: 20px; border-bottom: 1px solid #f0f0f0; padding-bottom: 15px;">
            <h1 style="font-size: 1.5em; color: #1E8449; margin: 0 0 5px 0; font-weight: 700; letter-spacing: 0.5px;">DISTRIBUIDORA TGI</h1>
            <p style="font-size: 0.85em; color: #7f8c8d; margin: 0;">Selecciona tus productos y envía tu lista por WhatsApp</p>
        </div>

        <!-- BARRA DE PESTAÑAS POR GRUPOS -->
        <div id="tgi-pestañas" style="display: flex; gap: 8px; overflow-x: auto; padding: 5px 2px 12px 2px; margin-bottom: 15px; border-bottom: 1px solid #f5f5f5; scrollbar-width: none; -webkit-overflow-scrolling: touch;">
            <!-- Las pestañas se crean solas -->
        </div>

        <!-- BUSCADOR RÁPIDO -->
        <div style="margin-bottom: 15px;">
            <input type="text" id="tgi-buscador" oninput="filtrarProductos()" placeholder="🔍 Buscar producto en este grupo..." style="width: 100%; padding: 10px 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 0.9em; box-sizing: border-box; outline: none; background: #fafafa;">
        </div>

        <!-- LISTADO DE PRODUCTOS -->
        <div id="contenedor-productos" style="display: flex; flex-direction: column; gap: 6px;">
            <p style="text-align: center; color: #95a5a6; font-size: 0.9em; padding: 40px 0;">Cargando catálogo oficial...</p>
        </div>
    </div>

    <!-- SCRIPT DE OPERACIÓN COMERCIAL -->
    <script>
    let todosLosProductos = [];
    let grupoSeleccionado = "";
    const NÚMERO_WHATSAPP = "51917764281";

    // 1. Conexión limpia y directa mediante JSONP (Salva el bloqueo de GitHub Pages)
    function cargarWebMatriz() {
      const urlJSON = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbPkbgiCxe2RMmyLOrObjSI7yG6u9sszjPvC0BM8mKb3S4Q_lhZLqAaOdAhFW6glpChhoWvdYpHan7/pub?gid=1523459015&single=true&output=csv";

      fetch(urlJSON)
        .then(res => res.text())
        .then(texto => {
          // Limpieza del texto JSON que entrega Google
          const inicio = texto.indexOf("{");
          const fin = texto.lastIndexOf("}");
          const jsonLimpio = JSON.parse(texto.substring(inicio, fin + 1));
          const filas = jsonLimpio.table.rows;
          
          todosLosProductos = [];
          
          filas.forEach((fila, index) => {
            const c = fila.c;
            // Validamos que la fila tenga datos reales en Categoría (A) y Producto (B)
            if (c && c[0] && c[0].v && c[1] && c[1].v) {
              todosLosProductos.push({
                id: index,
                categoria: c[0].v.toString().trim(), // Columna A
                producto: c[1].v.toString().trim(),  // Columna B
                medida: c[2] ? c[2].v.toString().trim() : "UNID", // Columna C
                precioEntero: parseFloat(c[5] ? c[5].v : 0) || 0,   // Columna F
                precioFraccion: parseFloat(c[11] ? c[11].v : 0) || 0, // Columna L
                cantidad: 0,
                nota: ""
              });
            }
          });

          if (todosLosProductos.length > 0) {
            grupoSeleccionado = todosLosProductos[0].categoria;
          }
          
          reconstruirPantalla();
          crearBotonWhatsApp();
        })
        .catch(err => {
          document.getElementById('contenedor-productos').innerHTML = "<p style='text-align:center; color:#c0392b; font-size:0.9em; padding:20px;'>⚠️ Error de enlace. Verifica que tu Google Sheets esté publicado en la web.</p>";
        });
    }

    // 2. Renderizado de interfaz minimalista y compacta
    function reconstruirPantalla(productosAFiltrar = null) {
      const divPestañas = document.getElementById('tgi-pestañas');
      const divProductos = document.getElementById('contenedor-productos');
      if (!divProductos) return;

      // Generar pestañas de grupos únicos
      const grupos = [...new Set(todosLosProductos.map(p => p.categoria))];

      if (divPestañas) {
        divPestañas.innerHTML = grupos.map(g => {
          const activo = g === grupoSeleccionado;
          return `
            <button onclick="cambiarDeGrupo('${g}')" style="
              padding: 6px 14px;
              background: ${activo ? '#1E8449' : '#f5f5f5'};
              color: ${activo ? '#ffffff' : '#555555'};
              border: none;
              border-radius: 20px;
              font-size: 0.82em;
              font-weight: 600;
              cursor: pointer;
              white-space: nowrap;
              transition: all 0.1s ease;
            ">${g}</button>
          `;
        }).join('');
      }

      // Filtrar el listado según el grupo activo o la búsqueda
      const filtrados = productosAFiltrar || todosLosProductos.filter(p => p.categoria === grupoSeleccionado);

      let html = "";
      filtrados.forEach(p => {
        // Lógica visual: Si tiene precio de fracción en Excel, muestra ambos, si no, solo el entero
        const muestraPrecio = p.precioFraccion > 0 
          ? `<span style="font-weight:700; color:#1E8449; font-size:0.95em;">S/. ${p.precioEntero.toFixed(2)}</span><br><span style="font-size:0.75em; color:#7f8c8d;">½: S/. ${p.precioFraccion.toFixed(2)}</span>`
          : `<span style="font-weight:700; color:#1E8449; font-size:0.95em;">S/. ${p.precioEntero.toFixed(2)}</span>`;

        html += `
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid #f9f9f9; font-size: 0.9em; gap: 10px; background: #fff;">
            
            <!-- Detalle de Producto -->
            <div style="flex: 2; text-align: left; min-width: 120px;">
              <b style="color: #2c3e50; font-size: 0.95em; display: block;">${p.producto}</b>
              <span style="color: #95a5a6; font-size: 0.78em; font-weight: 500;">Medida: ${p.medida.toUpperCase()}</span>
            </div>
            
            <!-- Entradas de Datos (Nota + Cantidad) -->
            <div style="flex: 3; display: flex; align-items: center; gap: 6px; justify-content: flex-end;">
              <input type="text" placeholder="Nota: maduro, pinto..." value="${p.nota}" 
                oninput="guardarNota(${p.id}, this.value)" 
                style="width: 100%; max-width: 130px; padding: 5px 8px; border: 1px solid #e0e0e0; border-radius: 5px; font-size: 0.8em; color: #555; background: #fafafa; outline: none;">
              
              <input type="number" min="0" step="any" placeholder="0" value="${p.cantidad || ''}" 
                oninput="guardarCantidad(${p.id}, this.value)" 
                style="width: 50px; padding: 5px; border: 1px solid #cccccc; border-radius: 5px; text-align: center; font-size: 0.88em; font-weight: bold; color: #2c3e50; outline: none;">
            </div>

            <!-- Columna de Precios -->
            <div style="min-width: 75px; text-align: right; line-height: 1.1;">
              ${muestraPrecio}
            </div>

          </div>
        `;
      });

      divProductos.innerHTML = html || "<p style='text-align:center; color:#999; padding:20px;'>No se encontraron productos.</p>";
    }

    function cambiarDeGrupo(nombre) {
      grupoSeleccionado = nombre;
      document.getElementById('tgi-buscador').value = ""; // Limpiar buscador al cambiar pestaña
      reconstruirPantalla();
    }

    function guardarCantidad(id, val) {
      const p = todosLosProductos.find(prod => prod.id === id);
      if (p) {
        p.cantidad = parseFloat(val) || 0;
        actualizarSumaBoton();
      }
    }

    function guardarNota(id, val) {
      const p = todosLosProductos.find(prod => prod.id === id);
      if (p) p.nota = val.trim();
    }

    // 3. Función matemática comercial exacta (Fracciona si el producto lo amerita)
    function calcularSubtotalProducto(p) {
      if (p.cantidad <= 0) return 0;

      // Si no tiene precio de fracción en el Excel (columna L en 0 o vacía), calcula todo con el entero normal
      if (p.precioFraccion === 0) {
        return p.cantidad * p.precioEntero;
      }

      // Separamos los enteros (1, 2, 3...) de los decimales (0.5)
      const parteEntera = Math.floor(p.cantidad); 
      const parteFraccion = p.cantidad - parteEntera; 

      const costoEntero = parteEntera * p.precioEntero;
      
      // Si el cliente pide una fracción (como 0.5), el sistema le asigna el valor exacto de la columna L
      const costoFraccion = (parteFraccion / 0.5) * p.precioFraccion; 

      return costoEntero + costoFraccion;
    }

    // 4. Crear el Botón Flotante Elegante de WhatsApp para enviar la lista
    function crearBotonWhatsApp() {
      if (document.getElementById('btn-whatsapp-tgi')) return;

      const btn = document.createElement('div');
      btn.id = 'btn-whatsapp-tgi';
      btn.style.cssText = `
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #1E8449;
        color: white;
        padding: 12px 22px;
        border-radius: 30px;
        font-size: 0.9em;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(30,132,73,0.3);
        cursor: pointer;
        z-index: 99999;
        font-family: sans-serif;
        display: flex;
        align-items: center;
        gap: 6px;
      `;
      btn.innerHTML = `🛒 Enviar Pedido (S/. 0.00) `;
      btn.onclick = enviarWhatsApp;
      document.body.appendChild(btn);
    }
