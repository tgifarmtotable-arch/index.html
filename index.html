<!-- SISTEMA PREMIUM ULTRA VELOZ DISTRIBUIDORA TGI -->
<div id="tgi-bloque-sistema" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 650px; margin: 0 auto; padding: 10px; background: #ffffff;">
  
  <!-- BARRA DE PESTAÑAS INDEPENDIENTES -->
  <div id="tgi-pestañas" style="display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; margin-bottom: 15px; border-bottom: 2px solid #f7f9fa; -webkit-overflow-scrolling: touch; scrollbar-width: none;">
    <!-- Se generan solas aquí -->
  </div>

  <!-- SECCIÓN DE PRODUCTOS COMPACTA -->
  <div id="contenedor-productos" style="display: flex; flex-direction: column; gap: 5px;">
    <p style="text-align: center; color: #999; font-size: 0.95em; padding: 30px;">Conectando de forma segura con la lista...</p>
  </div>
</div>

<script>
let todosLosProductos = [];
let grupoSeleccionado = "";
const NÚMERO_WHATSAPP = "51917764281";

// 1. Descarga veloz usando la API pública de Google (Evita bloqueos de GitHub)
function cargarWebMatriz() {
  // ID de tu documento unificado WEB MATRIZ
 const urlJSON = "https://google.com";


  fetch(urlJSON)
    .then(res => res.text())
    .then(texto => {
      // Limpar el formato JSON que devuelve Google
      const jsonLimpio = JSON.parse(texto.substring(47, texto.length - 2));
      const filas = jsonLimpio.table.rows;
      
      todosLosProductos = [];
      
      filas.forEach((fila, index) => {
        const c = fila.c;
        // Validar que las celdas tengan contenido real
        if (c[0] && c[1] && c[3]) {
          todosLosProductos.push({
            id: index,
            categoria: c[0].v.toString().trim(), // Columna A
            producto: c[1].v.toString().trim(),  // Columna B
            medida: c[2] ? c[2].v.toString().trim() : "unid", // Columna C
            precio: parseFloat(c[3].v) || 0,     // Columna F
            cantidad: 0,
            nota: ""
          });
        }
      });

      if (todosLosProductos.length > 0) {
        grupoSeleccionado = todosLosProductos[0].categoria;
      }
      
      reconstruirPantalla();
      crearBotonWhatsApp();
    })
    .catch(err => {
      document.getElementById('contenedor-productos').innerHTML = "<p style='text-align:center; color:#c0392b; font-size:0.9em; padding:20px;'>⚠️ Error al sincronizar con Google Sheets. Verifica la conexión.</p>";
    });
}

// 2. Pintar el catálogo hiper-compacto y fino
function reconstruirPantalla() {
  const divPestañas = document.getElementById('tgi-pestañas');
  const divProductos = document.getElementById('contenedor-productos');
  if (!divProductos) return;

  // Extraer nombres de grupos sin repetir
  const grupos = [...new Set(todosLosProductos.map(p => p.categoria))];

  // Renderizar los botones redondeados de pestañas superiores
  if (divPestañas) {
    divPestañas.innerHTML = grupos.map(g => {
      const activo = g === grupoSeleccionado;
      return `
        <button onclick="cambiarDeGrupo('${g}')" style="
          padding: 6px 15px;
          background: ${activo ? '#1E8449' : '#f4f6f8'};
          color: ${activo ? '#ffffff' : '#4a5568'};
          border: none;
          border-radius: 20px;
          font-size: 0.85em;
          font-weight: 600;
          cursor: pointer;
          white-space: nowrap;
          transition: all 0.15s ease;
        ">${g}</button>
      `;
    }).join('');
  }

  // Filtrar productos del grupo seleccionado
  const filtrados = todosLosProductos.filter(p => p.categoria === grupoSeleccionado);

  // Armar lista fina elegante tipo menú gourmet
  let html = "";
  filtrados.forEach(p => {
    html += `
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid #f8fafc; font-size: 0.92em; gap: 10px;">
        
        <!-- Nombre y Presentación del Producto -->
        <div style="flex: 2; text-align: left;">
          <b style="color: #1a202c; display: block; font-weight: 600;">${p.producto}</b>
          <span style="color: #718096; font-size: 0.8em;">Presentación: ${p.medida.toLowerCase()}</span>
        </div>
        
        <!-- Entradas del Pedido (Nota Fina + Cantidad) -->
        <div style="flex: 3; display: flex; align-items: center; gap: 6px; justify-content: flex-end;">
          <input type="text" placeholder="Nota: maduro, pinto..." value="${p.nota}" 
            oninput="guardarNota(${p.id}, this.value)" 
            style="width: 100%; max-width: 150px; padding: 4px 8px; border: 1px solid #e2e8f0; border-radius: 4px; font-size: 0.8em; color: #4a5568; background: #f8fafc; outline: none; border-style: solid;">
          
          <input type="number" min="0" placeholder="0" value="${p.cantidad || ''}" 
            oninput="guardarCantidad(${p.id}, this.value)" 
            style="width: 40px; padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; text-align: center; font-size: 0.88em; font-weight: bold; color: #1a202c; outline: none; border-style: solid;">
        </div>

        <!-- Precio Unitario en Verde -->
        <div style="min-width: 65px; text-align: right; font-weight: 700; color: #27AE60;">
          S/. ${p.precio.toFixed(2)}
        </div>

      </div>
    `;
  });

  divProductos.innerHTML = html;
}

function cambiarDeGrupo(nombre) {
  grupoSeleccionado = nombre;
  reconstruirPantalla();
}

function guardarCantidad(id, val) {
  const p = todosLosProductos.find(prod => prod.id === id);
  if (p) {
    p.cantidad = parseFloat(val) || 0;
    actualizarSumaBoton();
  }
}

function guardarNota(id, val) {
  const p = todosLosProductos.find(prod => prod.id === id);
  if (p) p.nota = val.trim();
}

// 3. Botón Premium Flotante de WhatsApp para despachar pedidos
function crearBotonWhatsApp() {
  if (document.getElementById('btn-whatsapp-tgi')) return;

  const btn = document.createElement('div');
  btn.id = 'btn-whatsapp-tgi';
  btn.style.cssText = `
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #1E8449;
    color: white;
    padding: 11px 22px;
    border-radius: 30px;
    font-size: 0.92em;
    font-weight: bold;
    box-shadow: 0 4px 12px rgba(30,132,73,0.3);
    cursor: pointer;
    z-index: 99999;
  `;
  btn.innerHTML = `🛒 Enviar Pedido (S/. 0.00)`;
  btn.onclick = enviarWhatsApp;
  document.body.appendChild(btn);
}

function actualizarSumaBoton() {
  let t = 0;
  todosLosProductos.forEach(p => t += p.cantidad * p.precio);
  const btn = document.getElementById('btn-whatsapp-tgi');
  if (btn) btn.innerHTML = `🛒 Enviar Pedido (S/. ${t.toFixed(2)})`;
}

// 4. Redirección directa al WhatsApp del Cliente con su Pedido Armado
function enviarWhatsApp() {
  const pedido = todosLosProductos.filter(p => p.cantidad > 0);
  if (pedido.length === 0) {
    alert("Por favor, selecciona al menos un producto antes de enviar tu orden.");
    return;
  }
  
  let m = "🛒 *NUEVO PEDIDO - DISTRIBUIDORA TGI*\n";
  m += "===============================\n\n";
  let total = 0;
  
  pedido.forEach((p, index) => {
    const sub = p.cantidad * p.precio;
    total += sub;
    m += `*${index + 1}. ${p.producto}* (${p.medida.toLowerCase()})\n`;
    m += `   Cant: *${p.cantidad}* x S/. ${p.precio.toFixed(2)} = S/. ${sub.toFixed(2)}\n`;
    if (p.nota) m += `   📝 _Nota: ${p.nota}_\n`;
    m += `---------------------------\n`;
  });
  
  m += `\n💰 *TOTAL ESTIMADO A PAGAR: S/. ${total.toFixed(2)}*`;
  
  window.open(`https://whatsapp.com{NÚMERO_WHATSAPP}&text=${encodeURIComponent(m)}`, '_blank');
}

// Inicializar la carga segura
cargarWebMatriz();
</script>
