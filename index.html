<!-- SISTEMA COMERCIAL PREMIUM DISTRIBUIDORA TGI: PESTAÑAS INDEPENDIENTES -->
<div id="tgi-sistema-tienda" style="font-family: 'Segoe UI', Roboto, sans-serif; max-width: 750px; margin: 0 auto; padding: 15px; background: #ffffff;">
  
  <!-- MENÚ DE PESTAÑAS SUPERIOR -->
  <div id="tgi-pestañas-contenedor" style="display: flex; gap: 10px; overflow-x: auto; padding: 10px 5px; margin-bottom: 20px; border-bottom: 2px solid #f0f0f0; scrollbar-width: none; -webkit-overflow-scrolling: touch;">
    <!-- Las pestañas se inyectarán de forma automática aquí -->
  </div>

  <!-- AREA DE EXPOSICIÓN DE PRODUCTOS DEL GRUPO -->
  <div id="contenedor-productos">
    <p style="text-align: center; color: #888; font-size: 0.95em; padding: 30px;">Cargando catálogo elegante...</p>
  </div>

</div>

<script>
let todosLosProductos = [];
let categoriaActiva = ""; 
const NÚMERO_WHATSAPP = "51917764281"; 

// 1. Descargar la Web Matriz CSV de Google Sheets
async function cargarWebMatriz() {
  const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbPkbgiCxe2RMmyLOrObjSI7yG6u9sszjPvC0BM8mKb3S4Q_lhZLqAaOdAhFW6glpChhoWvdYpHan7/pub?gid=1523459015&single=true&output=csv";
  
  try {
    const respuesta = await fetch(urlCSV);
    const textoCSV = await respuesta.text();
    const filas = textoCSV.split("\n").map(f => f.split(","));
    todosLosProductos = [];
    
    for(let i = 1; i < filas.length; i++) {
      const celda = filas[i];
      if (celda.length >= 6 && celda && celda[0].trim() !== "") {
        todosLosProductos.push({
          id: i,
          categoria: celda[0].replace(/"/g, "").trim(), // Columna A
          producto: celda[1].replace(/"/g, "").trim(),  // Columna B
          medida: celda[2].replace(/"/g, "").trim(),    // Columna C
          precioEntero: parseFloat(celda[5].replace(/"/g, "").trim()) || 0, // Columna F
          cantidad: 0,
          nota: ""
        });
      }
    }
    
    // Fijar el primer grupo visible por defecto
    if(todosLosProductos.length > 0) {
      categoriaActiva = todosLosProductos[0].categoria;
    }
    
    dibujarInterfazMatriz();
    inyectarBotonWhatsApp();
  } catch (error) {
    console.error("Error al conectar con la matriz de datos:", error);
  }
}

// 2. Construir la pantalla limpia por grupo (Formato compacto de alta costura)
function dibujarInterfazMatriz() {
  const contenedorPestañas = document.getElementById('tgi-pestañas-contenedor');
  const contenedorProductos = document.getElementById('contenedor-productos');
  
  if (!contenedorProductos) return;

  // Extraer las categorías sin repetir
  const categoriasUnicas = [...new Set(todosLosProductos.map(p => p.categoria))];

  // Crear botones de pestañas horizontales independientes
  if(contenedorPestañas) {
    contenedorPestañas.innerHTML = categoriasUnicas.map(cat => {
      const esActiva = cat === categoriaActiva;
      return `
        <button onclick="cambiarGrupo('${cat}')" style="
          padding: 8px 18px;
          background: ${esActiva ? '#1E8449' : '#f8f9fa'};
          color: ${esActiva ? '#ffffff' : '#4a5568'};
          border: 1px solid ${esActiva ? '#1E8449' : '#e2e8f0'};
          border-radius: 25px;
          font-size: 0.88em;
          font-weight: 600;
          cursor: pointer;
          white-space: nowrap;
          transition: all 0.2s ease-in-out;
          box-shadow: ${esActiva ? '0 3px 8px rgba(30,132,73,0.25)' : 'none'};
        ">${cat}</button>
      `;
    }).join('');
  }

  // Filtrar únicamente los productos pertenecientes a la pestaña activa
  const productosDelGrupo = todosLosProductos.filter(p => p.categoria === categoriaActiva);

  let htmlProductos = `
    <div style="display: flex; flex-direction: column; gap: 5px; background: #ffffff;">
  `;

  productosDelGrupo.forEach(prod => {
    const prodOriginal = todosLosProductos.find(p => p.id === prod.id);
    
    htmlProductos += `
      <div class="tgi-tarjeta" style="display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; background: #ffffff; border-bottom: 1px solid #f1f5f9; gap: 12px;">
        
        <!-- Nombre Corto e Indicador de Medida -->
        <div style="flex: 2; text-align: left; font-size: 0.92em;">
          <span style="font-weight: 600; color: #1a202c; display: block; line-height: 1.2;">${prodOriginal.producto}</span>
          <span style="color: #718096; font-size: 0.8em; font-weight: 400;">Unid: ${prodOriginal.medida.toLowerCase()}</span>
        </div>
        
        <!-- Bloque de Entradas Compactas (Notas + Selector en una sola línea) -->
        <div style="flex: 3; display: flex; align-items: center; gap: 8px; justify-content: flex-end;">
          <input type="text" placeholder="Nota: pinto, maduro..." value="${prodOriginal.nota || ''}" 
            oninput="actualizarNota(${prodOriginal.id}, this.value)" 
            style="width: 100%; max-width: 160px; padding: 5px 8px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 0.82em; color: #334155; background: #f8fafc; outline: none; border-style: solid;">
          
          <input type="number" min="0" placeholder="0" value="${prodOriginal.cantidad || ''}" 
            oninput="actualizarCantidad(${prodOriginal.id}, this.value)" 
            style="width: 45px; padding: 4px; border: 1px solid #cbd5e1; border-radius: 5px; text-align: center; font-size: 0.9em; font-weight: bold; color: #1a202c; background: #ffffff; outline: none; border-style: solid;">
        </div>

        <!-- Muestra del Precio Neto -->
        <div style="min-width: 70px; text-align: right; font-weight: 700; color: #2ecc71; font-size: 0.95em;">
          S/. ${prodOriginal.precioEntero.toFixed(2)}
        </div>

      </div>
    `;
  });

  htmlProductos += `</div>`;
  contenedorProductos.innerHTML = htmlProductos;
}

// Intercambiador manual de grupos
function cambiarGrupo(nuevoGrupo) {
  categoriaActiva = nuevoGrupo;
  dibujarInterfazMatriz();
}

function actualizarCantidad(id, valor) {
  const prod = todosLosProductos.find(p => p.id === id);
  if(prod) {
    prod.cantidad = parseFloat(valor) || 0;
    actualizarBotonFlotante();
  }
}

function actualizarNota(id, valor) {
  const prod = todosLosProductos.find(p => p.id === id);
  if(prod) prod.nota = valor.trim();
}

// 3. Sistema dinámico de botón flotante para WhatsApp

    font-weight: 600;

    cursor: pointer;

    Enviar Pedido (S/. 0.00)

  let total = 0;
  todosLosProductos.forEach(p => {
    total += p.cantidad * p.precioEntero;
  });
  
  const btn = document.getElementById('btn-whatsapp-flotante');
  if(btn) {
    btn.innerHTML = `
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.513 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.713-1.457L0 24zm6.59-4.846c1.66.986 3.292 1.493 4.9c1.495.004 5.428-1.746 6.55-4.9.124-.347.01-.644-.066-.763-.076-.12-.247-.193-.518-.327-.271-.135-1.604-.791-1.853-.882-.249-.09-.431-.135-.615.135-.183.27-.712.893-.872 1.074-.16.181-.32.203-.591.068-.271-.134-1.144-.421-2.179-1.343-.804-.715-1.347-1.602-1.505-1.872-.159-.27-.017-.417.118-.552.122-.121.27-.32.406-.479.135-.16.181-.271.271-.452.09-.18.045-.339-.022-.474-.068-.135-.615-1.482-.843-2.029-.222-.534-.444-.46-.615-.469-.158-.008-.339-.01-.52-.01-.18 0-.475.068-.724.339-.249.271-.95 1.287-.95 3.136s1.356 3.635 1.545 3.883c.188.249 2.666 4.072 6.459 5.705.902.389 1.607.621 2.156.796.906.288 1.732.247 2.384.15.727-.108 2.234-.913 2.544-1.796.309-.882.309-1.638.217-1.796-.093-.158-.339-.249-.586-.384z"/></svg>

}

// 4. Compilar resumen final para WhatsApp Web
function enviarPedidoWhatsApp() {
  const pedidoFiltrado = todosLosProductos.filter(p => p.cantidad > 0);
  
  if (pedidoFiltrado.length === 0) {
    alert("Tu lista de pedido está vacía. Selecciona cantidades primero.");
    return;
  }
  
  let mensaje = "🛒 *NUEVO PEDIDO - DISTRIBUIDORA TGI*\n";
  mensaje += "===============================\n\n";
  let totalPedido = 0;
  
  pedidoFiltrado.forEach((p, idx) => {
