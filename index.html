<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGI - Pedidos</title>
    <style>
        :root {
            --bg-color: #f9f9f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #25D366; 
            --border-color: #e0e0e0;
            --btn-green: #0F7643;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding-bottom: 140px;
        }
        .header-negocio {
            text-align: center;
            padding: 20px;
            background: #fff;
            border-bottom: 1px solid var(--border-color);
        }
        .header-negocio h1 {
            color: var(--btn-green);
            margin: 0;
            font-size: 1.6rem;
            text-transform: uppercase;
        }
        .header-negocio p {
            margin: 5px 0 0 0;
            color: #666;
            font-size: 0.9rem;
        }
        .whatsapp-visible {
            display: inline-block;
            margin-top: 8px;
            background: #e8f5e9;
            color: #1b5e20;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .tabs-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid var(--border-color);
        }
        .tab-btn {
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: #f0f0f0;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            color: #555;
        }
        .tab-btn.active {
            background: var(--btn-green);
            color: #fff;
            border-color: var(--btn-green);
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
        }
        .categoria-contenido {
            display: none;
        }
        .categoria-contenido.active {
            display: block;
        }
        .producto-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .producto-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .producto-nombre {
            font-weight: 600;
        }
        .producto-precios {
            font-size: 0.85rem;
            color: #666;
            text-align: right;
        }
        .opciones-seleccion {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
        }
        .barra-inferior {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            border-top: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .valores-resumen {
            font-size: 0.85rem;
            color: #555;
        }
        .valores-resumen .total-destacado {
            font-size: 1.1rem;
            font-weight: bold;
            color: #000;
        }
        .btn-whatsapp {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="header-negocio">
        <h1>TGI</h1>
        <p>CALIDAD sin salir de casa</p>
        <div class="whatsapp-visible">Pedir al: +51 917 764 281</div>
    </div>

    <div class="tabs-container">
        <button class="tab-btn active" onclick="cambiarPestaña('verduras', this)">🥦 VERDURAS FRESCAS</button>
        <button class="tab-btn" onclick="cambiarPestaña('frutas', this)">🍎 FRUTAS SELECTAS</button>
    </div>

    <div class="container">
        <div id="loading" class="loading">Cargando productos en vivo...</div>
        <div id="verduras" class="categoria-contenido active"></div>
        <div id="frutas" class="categoria-contenido"></div>
    </div>

    <div class="barra-inferior">
        <div class="valores-resumen">
            <div>Kilos: <span id="resumen-peso">0.00 kg</span></div>
            <div>Delivery: S/. <span id="resumen-delivery">0.00</span></div>
            <div class="total-destacado">Total: S/. <span id="resumen-total">0.00</span></div>
        </div>
        <button class="btn-whatsapp" onclick="enviarWhatsApp()">Pedir por WhatsApp ➜</button>
    </div>

<script>
    // ⚠️ REEMPLAZA EL TEXTO DE ABAJO CON TU ENLACE /exec DEL PASO 1
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxClTCrnjtbeWLiogi4ZM6yLmB-FRAvqG4ytkVrkzPR-aoYYSD-rLr9-asLxzun0U0X/exec";

    async function consumirMatriz() {
        try {
            const respuesta = await fetch(URL_SCRIPT);
            const productos = await respuesta.json();
            procesarDatos(productos);
            document.getElementById('loading').style.display = 'none';
        } catch (error) {
            console.error("Error conectando con Apps Script:", error);
            document.getElementById('loading').innerText = "Error al conectar con Google Sheets.";
        }
    }

    function procesarDatos(productos) {
        const contenedorVerduras = document.getElementById('verduras');
        const contenedorFrutas = document.getElementById('frutas');

        contenedorVerduras.innerHTML = "";
        contenedorFrutas.innerHTML = "";

        productos.forEach(prod => {
            const categoria = prod.categoria || "";
            const producto = prod.producto || "";
            const medida = prod.medida || "";
            const precioEntero = prod.precioEntero || 0;
            const precioFraccion = prod.precioFraccion || 0;

            if (!producto || producto === "PRODUCTO") return;

            const esPollo = producto.toUpperCase().includes("POLLO ENTERO");
            let txtFraccion = medida.toUpperCase() === "ATADO" ? "Medio Atado" : "Medio Kilo";
            if (esPollo) txtFraccion = "Precio Especial (2 a más)";

            let opcionesHTML = `
                <option value="0" data-peso="0">-- Cantidad --</option>
                <option value="1" data-peso="1">1 ${medida.toLowerCase()}</option>
            `;

            if (precioFraccion > 0 && !esPollo) {
                opcionesHTML += `<option value="0.5" data-peso="0.5" data-es-fraccion="true">${txtFraccion}</option>`;
            }

            opcionesHTML += `
                <option value="2" data-peso="2">2 ${medida.toLowerCase()}s</option>
                <option value="3" data-peso="3">3 ${medida.toLowerCase()}s</option>
                <option value="4" data-peso="4">4 ${medida.toLowerCase()}s</option>
                <option value="5" data-peso="5">5 ${medida.toLowerCase()}s</option>
            `;

            let precioDetalle = `S/. ${precioEntero.toFixed(2)} ${medida.toLowerCase()}`;
            if (precioFraccion > 0) {
                precioDetalle += esPollo 
                    ? `<br><small style="color:green; font-weight:bold;">2 a más: S/. ${precioFraccion.toFixed(2)} c/u</small>` 
                    : `<br><small>Frac: S/. ${precioFraccion.toFixed(2)}</small>`;
            }

            const cardHTML = `
                <div class="producto-card" 
                     data-nombre="${producto}" 
                     data-precio-base="${precioEntero}" 
                     data-precio-fraccion="${precioFraccion}" 
                     data-categoria="${categoria}"
                     data-es-pollo="${esPollo ? 'true' : 'false'}">
                    <div class="producto-header">
                        <span class="producto-nombre">${producto}</span>
                        <div class="producto-precios">${precioDetalle}</div>
                    </div>
                    <div class="opciones-seleccion">
                        <select class="select-opcion" onchange="calcularPedido()">
                            ${opcionesHTML}
                        </select>
                    </div>
                    <input type="text" class="input-nota" placeholder="Notas (maduro, pintón, etc.)..." oninput="calcularPedido()">
                </div>
            `;

            if (categoria.includes("VERDURAS")) {
                contenedorVerduras.innerHTML += cardHTML;
            } else if (categoria.includes("FRUTAS")) {
                contenedorFrutas.innerHTML += cardHTML;
            }
        });
    }

    function cambiarPestaña(idCategoria, boton) {
        document.querySelectorAll('.categoria-contenido').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(idCategoria).classList.add('active');
        boton.classList.add('active');
    }

    function calcularPedido() {
        let subtotal = 0;
        let pesoTotal = 0;
