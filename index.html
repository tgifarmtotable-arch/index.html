<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidora TGI - Pedidos Rápidos</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

    <!-- CONTENEDOR MINIMALISTA PREMIUM -->
    <div style="max-width: 550px; margin: 0 auto; padding: 20px 15px; background: #ffffff; min-height: 100vh; box-sizing: border-box; position: relative;">
        
        <!-- CABECERA DE LA TIENDA -->
        <div style="text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #f1f5f9;">
            <h1 style="font-size: 1.6em; color: #1E8449; margin: 0 0 4px 0; font-weight: 700; letter-spacing: 0.5px;">DISTRIBUIDORA TGI</h1>
            <p style="font-size: 0.85em; color: #64748b; margin: 0; font-weight: 500;">Tu mercado fresco a un clic de distancia</p>
        </div>

        <!-- MENU DE GRUPOS -->
        <div style="display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px;">
            <button onclick="cambiarGrupo('VERDURAS FRESCAS')" id="btn-verduras" style="padding: 8px 16px; background: #1E8449; color: white; border: none; border-radius: 20px; font-weight: 600; font-size: 0.85em; cursor: pointer;">🥦 VERDURAS FRESCAS</button>
            <button onclick="cambiarGrupo('FRUTAS SELECTAS')" id="btn-frutas" style="padding: 8px 16px; background: #f1f5f9; color: #475569; border: none; border-radius: 20px; font-weight: 600; font-size: 0.85em; cursor: pointer;">🍓 FRUTAS SELECTAS</button>
        </div>

        <!-- LISTADO DE PRODUCTOS ULTRACOMPACTO -->
        <div id="contenedor-productos" style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 110px;">
            <!-- Los productos se pintan aquí al instante -->
        </div>

        <!-- BARRA INFERIOR DE COSTOS FIJA -->
        <div style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 550px; background: #ffffff; box-shadow: 0 -4px 20px rgba(0,0,0,0.06); padding: 12px 20px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e2e8f0; z-index: 9999;">
            <div style="text-align: left; line-height: 1.3;">
                <span style="font-size: 0.8em; color: #64748b; font-weight: 600; display: block;" id="txt-peso">Kilos: 0.00 kg</span>
                <span style="font-size: 0.8em; color: #64748b; font-weight: 600; display: block;" id="txt-delivery">Delivery: S/. 0.00</span>
                <span style="font-size: 1.1em; font-weight: 700; color: #1e293b;">Total: <span id="txt-total" style="color: #27AE60;">S/. 0.00</span></span>
            </div>
            <button onclick="enviarWhatsApp()" style="background: #1E8449; color: #ffffff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 700; font-size: 0.95em; cursor: pointer;">
                Pedir por WhatsApp ➔
            </button>
        </div>

    </div>

    <script>
    const NÚMERO_WHATSAPP = "51917764281";
    let grupoActivo = "VERDURAS FRESCAS";

    // Base de datos integrada directamente para asegurar velocidad y estabilidad absoluta
    const productosTGI = [
        // VERDURAS FRESCAS
        { cat: "VERDURAS FRESCAS", name: "ACELGA", med: "ATADO", pEntero: 5.00, pFrac: 0 },
        { cat: "VERDURAS FRESCAS", name: "AJI AMARILLO", med: "KILO", pEntero: 8.00, pFrac: 4.25 },
        { cat: "VERDURAS FRESCAS", name: "AJI CHARAPITA", med: "TAPER", pEntero: 4.00, pFrac: 0 },
        { cat: "VERDURAS FRESCAS", name: "AJI LIMO", med: "KILO", pEntero: 7.50, pFrac: 4.00 },
        { cat: "VERDURAS FRESCAS", name: "AJO ENTERO", med: "KILO", pEntero: 9.50, pFrac: 5.00 },
        { cat: "VERDURAS FRESCAS", name: "AJO ENTERO EXTRA", med: "KILO", pEntero: 15.50, pFrac: 8.00 },
        { cat: "VERDURAS FRESCAS", name: "ALCACHOFA", med: "UNIDAD", pEntero: 3.50, pFrac: 0 },
        { cat: "VERDURAS FRESCAS", name: "ALVERJON", med: "KILO", pEntero: 9.50, pFrac: 5.00 },
        { cat: "VERDURAS FRESCAS", name: "ARVERJA", med: "UNIDAD", pEntero: 8.50, pFrac: 4.50 },
        { cat: "VERDURAS FRESCAS", name: "BROCOLI", med: "KILO", pEntero: 5.50, pFrac: 0 },
        { cat: "VERDURAS FRESCAS", name: "CAMOTE AMARILLO", med: "KILO", pEntero: 3.10, pFrac: 0 },
        { cat: "VERDURAS FRESCAS", name: "CEBOLLA BLANCA", med: "KILO", pEntero: 3.50, pFrac: 0 },
        { cat: "VERDURAS FRESCAS", name: "CHOCLO GRANDE", med: "5U", pEntero: 13.50, pFrac: 0 },
        { cat: "VERDURAS FRESCAS", name: "ESPINACA", med: "KILO", pEntero: 4.00, pFrac: 2.50 },
        { cat: "VERDURAS FRESCAS", name: "KION", med: "KILO", pEntero: 4.50, pFrac: 2.50 },
        { cat: "VERDURAS FRESCAS", name: "TOMATE EXTRA", med: "KILO", pEntero: 7.50, pFrac: 0 },
        { cat: "VERDURAS FRESCAS", name: "YUCA", med: "KILO", pEntero: 3.20, pFrac: 0 },
        { cat: "VERDURAS FRESCAS", name: "ZANAHORIA SELECTA", med: "KILO", pEntero: 3.30, pFrac: 0 },
        
        // FRUTAS SELECTAS
        { cat: "FRUTAS SELECTAS", name: "AGUAYMANTO", med: "KILO", pEntero: 8.00, pFrac: 4.50 },
        { cat: "FRUTAS SELECTAS", name: "ARANDANO", med: "KILO", pEntero: 24.00, pFrac: 12.00 },
        { cat: "FRUTAS SELECTAS", name: "FRESA SELECTA", med: "KILO", pEntero: 11.00, pFrac: 6.00 },
        { cat: "FRUTAS SELECTAS", name: "GRANADILLA", med: "KILO", pEntero: 7.50, pFrac: 0 },
        { cat: "FRUTAS SELECTAS", name: "KIWI", med: "KILO", pEntero: 16.50, pFrac: 0 },
        { cat: "FRUTAS SELECTAS", name: "MANDARINA", med: "KILO", pEntero: 4.00, pFrac: 0 },
        { cat: "FRUTAS SELECTAS", name: "MANGO EDWARD", med: "KILO", pEntero: 8.00, pFrac: 0 },
        { cat: "FRUTAS SELECTAS", name: "PALTA FUERTE", med: "KILO", pEntero: 9.50, pFrac: 0 },
        { cat: "FRUTAS SELECTAS", name: "PAPAYA", med: "KILO", pEntero: 6.00, pFrac: 0 },
        { cat: "FRUTAS SELECTAS", name: "PIÑA GOLDEN GRANDE", med: "KILO", pEntero: 7.00, pFrac: 0 },
        { cat: "FRUTAS SELECTAS", name: "PLATANO ISLA", med: "KILO", pEntero: 4.50, pFrac: 0 },
        { cat: "FRUTAS SELECTAS", name: "SANDIA", med: "KILO", pEntero: 2.50, pFrac: 0 }
    ];

    // Añadir cajas de memoria para cantidades y notas
    productosTGI.forEach((p, i) => { p.id = i; p.cant = 0; p.nota = ""; });

    // Pintar la pantalla de inmediato
    function pintarCatalogo() {
        const div = document.getElementById('contenedor-productos');
        const filtrados = productosTGI.filter(p => p.cat === grupoActivo);
        
        let html = "";
        filtrados.forEach(p => {
            const muestraPrecio = p.pFrac > 0 
                ? `<span style="font-weight:700; color:#1E8449;">S/. ${p.pEntero.toFixed(2)}</span><br><span style="font-size:0.75em; color:#7f8c8d;">½: S/. ${p.pFrac.toFixed(2)}</span>`
                : `<span style="font-weight:700; color:#1E8449;">S/. ${p.pEntero.toFixed(2)}</span>`;

            html += `
                <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 6px; border-bottom: 1px solid #f1f5f9; font-size: 0.9em; gap: 10px; background: #fff;">
                    <div style="flex: 2; text-align: left;">
                        <b style="color: #1e293b; font-size: 0.92em; display: block; line-height:1.2;">${p.name}</b>
                        <span style="color: #94a3b8; font-size: 0.75em;">Medida: ${p.med}</span>
                    </div>
                    <div style="flex: 3; display: flex; align-items: center; gap: 6px; justify-content: flex-end;">
                        <input type="text" placeholder="Nota: verde, pinto..." value="${p.nota}" oninput="cambiarNota(${p.id}, this.value)" style="width: 100%; max-width: 125px; padding: 5px 8px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 0.8em; outline: none; background: #f8fafc;">
                        <input type="number" min="0" step="any" placeholder="0" value="${p.cant || ''}" oninput="cambiarCantidad(${p.id}, this.value)" style="width: 48px; padding: 5px; border: 1px solid #cbd5e1; border-radius: 6px; text-align: center; font-size: 0.88em; font-weight: bold; outline: none;">
                    </div>
                    <div style="min-width: 75px; text-align: right; line-height: 1.1;">
                        ${muestraPrecio}
                    </div>
                </div>
            `;
        });
        div.innerHTML = html;
    }

    function cambiarGrupo(grupo) {
        grupoActivo = grupo;
        document.getElementById('btn-verduras').style.background = grupo === 'VERDURAS FRESCAS' ? '#1E8449' : '#f1f5f9';
        document.getElementById('btn-verduras').style.color = grupo === 'VERDURAS FRESCAS' ? 'white' : '#475569';
        document.getElementById('btn-frutas').style.background = grupo === 'FRUTAS SELECTAS' ? '#1E8449' : '#f1f5f9';
        document.getElementById('btn-frutas').style.color = grupo === 'FRUTAS SELECTAS' ? 'white' : '#475569';
        pintarCatalogo();
    }

    function cambiarCantidad(id, val) {
        productosTGI[id].cant = parseFloat(val) || 0;
        recalcularValores();
    }

    function cambiarNota(id, val) {
        productosTGI[id].nota = val.trim();
    }

    // Lógica matemática comercial (Entero vs Fracción de tu cuadro unificado)
    function calcularSubtotal(p) {
        if (p.cant <= 0) return 0;
        if (p.pFrac === 0) return p.cant * p.pEntero;

        const enteros = Math.floor(p.cant);
        const fraccion = p.cant - enteros;

        const costoEntero = enteros * p.pEntero;
        const costoFraccion = (fraccion / 0.5) * p.pFrac;

        return costoEntero + costoFraccion;
    }

    // Regla de Delivery por peso
    function recalcularValores() {
        let totalProductos = 0;
        let kilosTotales = 0;

        productosTGI.forEach(p => {
